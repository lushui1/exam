<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;user-select:none;-webkit-user-select:none;overflow:hidden}
.header{text-align:center;margin-bottom:16px}
.title{font-size:52px;font-weight:900;background:linear-gradient(90deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.scores{display:flex;gap:16px;justify-content:center;margin-top:8px}
.score-box{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 18px;text-align:center;min-width:76px;backdrop-filter:blur(10px)}
.score-label{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:1px}
.score-value{font-size:22px;font-weight:700}
.board-wrap{position:relative}
.board{background:rgba(255,255,255,.06);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
.cell{width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:700;font-size:28px;transition:all .1s ease;background:rgba(255,255,255,.04)}
.cell-2{background:#eee4da;color:#776e65}.cell-4{background:#ede0c8;color:#776e65}
.cell-8{background:#f2b179;color:#fff}.cell-16{background:#f59563;color:#fff}
.cell-32{background:#f67c5f;color:#fff}.cell-64{background:#f65e3b;color:#fff}
.cell-128{background:#edcf72;color:#fff;font-size:22px}.cell-256{background:#edcc61;color:#fff;font-size:22px}
.cell-512{background:#edc850;color:#fff;font-size:22px}.cell-1024{background:#edc53f;color:#fff;font-size:18px}
.cell-2048{background:#edc22e;color:#fff;font-size:18px;box-shadow:0 0 30px rgba(237,194,46,.6)}
.cell-super{background:#3c3a32;color:#f9f6f2;font-size:16px}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes merge{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
.cell-new{animation:pop .18s ease}.cell-merged{animation:merge .15s ease}
.btn{margin-top:18px;padding:10px 28px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f7971e,#ffd200);color:#333;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(247,151,30,.35)}
.btn:active{transform:translateY(0)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
.overlay.show{opacity:1;pointer-events:auto}
.overlay h2{font-size:30px;margin-bottom:6px}.overlay p{opacity:.8;margin-bottom:14px;font-size:18px}
.hint{margin-top:12px;opacity:.4;font-size:13px}
@media(max-width:400px){.cell{width:62px;height:62px;font-size:22px}.cell-128,.cell-256,.cell-512{font-size:18px}.cell-1024,.cell-2048,.cell-super{font-size:14px}.title{font-size:38px}}
</style>
</head>
<body>
<div class="header">
  <div class="title">2048</div>
  <div class="scores">
    <div class="score-box"><div class="score-label">Score</div><div class="score-value" id="score">0</div></div>
    <div class="score-box"><div class="score-label">Best</div><div class="score-value" id="best">0</div></div>
  </div>
</div>
<div class="board-wrap">
  <div class="board" id="board"></div>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">Game Over</h2>
    <p id="ov-score"></p>
    <button class="btn" onclick="G.restart()">再来一局</button>
  </div>
</div>
<button class="btn" onclick="G.restart()">新游戏</button>
<div class="hint">⬆⬇⬅➡ / 滑动 控制方向</div>
<script>
const G=(()=>{const N=4;let grid,score,best=+localStorage.getItem('best2048')||0,moved,newCells,mergedCells;
const $=id=>document.getElementById(id);
const board=$('board'),scoreEl=$('score'),bestEl=$('best'),overlay=$('overlay'),ovTitle=$('ov-title'),ovScore=$('ov-score');

function init(){grid=Array.from({length:N},()=>Array(N).fill(0));score=0;moved=false;newCells=[];mergedCells=[];
  overlay.classList.remove('show');addRandom();addRandom();render()}

function addRandom(){const empty=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;const[r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<.9?2:4;newCells.push(r*N+c)}

function render(){board.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=grid[r][c];const d=document.createElement('div');
    d.className='cell'+(v?' cell-'+(v<=2048?v:'super'):'')+(newCells.includes(r*N+c)?' cell-new':'')+(mergedCells.includes(r*N+c)?' cell-merged':'');
    d.textContent=v||'';board.appendChild(d)}
  scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem('best2048',best)}bestEl.textContent=best;
  newCells=[];mergedCells=[]}

function slide(row){let a=row.filter(v=>v),merged=false;for(let i=0;i<a.length-1;i++)
  if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);merged=true}return{res:a,pad:Array(N-a.length).fill(0),merged}}

function move(dir){let prev=grid.map(r=>[...r]);moved=false;newCells=[];mergedCells=[];
  if(dir===3)//left
    for(let r=0;r<N;r++){const{res,pad,merged}=slide(grid[r]);grid[r]=[...res,...pad];if(merged)mergedCells.push(r*N+res.length-1)}
  else if(dir===1)//right
    for(let r=0;r<N;r++){const{res,pad,merged}=slide([...grid[r]].reverse());grid[r]=[...pad,...res.reverse()];if(merged)mergedCells.push(r*N+N-res.length)}
  else if(dir===0)//up
    for(let c=0;c<N;c++){const col=grid.map(r=>r[c]);const{res,pad,merged}=slide(col);
      for(let r=0;r<N;r++)grid[r][c]=[...res,...pad][r];if(merged)mergedCells.push(res.length-1===-1?-1:((res.length-1)*N+c))}
  else if(dir===2)//down
    for(let c=0;c<N;c++){const col=grid.map(r=>r[c]).reverse();const{res,pad,merged}=slide(col);
      const f=[...pad,...res.reverse()];for(let r=0;r<N;r++)grid[r][c]=f[r];if(merged)mergedCells.push((N-res.length)*N+c)}

  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]!==prev[r][c])moved=true;
  if(moved){addRandom();render();checkEnd()}}

function checkEnd(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!grid[r][c])return;
  if(c<N-1&&grid[r][c]===grid[r][c+1])return;if(r<N-1&&grid[r][c]===grid[r+1][c])return}
  ovTitle.textContent='Game Over';ovScore.textContent='得分: '+score;overlay.classList.add('show')}

// keyboard
document.addEventListener('keydown',e=>{const map={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3};
  if(map[e.key]!==undefined){e.preventDefault();move(map[e.key])}});

// touch
let tx,ty;board.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
board.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<30&&Math.abs(dy)<30)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0)},{passive:true});

init();return{restart:init}})();
</script>
</body>
</html>
